security_rules:
- action: alert_immediate
  name: night_intrusion
  severity: high
  time_range: 22:00-06:00
  trigger: person_detected
- action: alert_immediate
  name: unauthorized_entry
  severity: high
  time_range: 24h
  trigger: person_in_restricted
- action: alert
  name: multiple_people
  severity: medium
  time_range: 24h
  trigger: person_count_gt_2
- action: alert
  name: loitering
  severity: medium
  time_range: 24h
  trigger: person_stay_gt_120s
zones: {}
