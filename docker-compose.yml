version: '3.8'

services:
  jarvis:
    build: .
    container_name: jarvis-home
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - jarvis-data:/app/data
      - jarvis-logs:/app/logs
    environment:
      - TZ=Asia/Kolkata
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  jarvis-data:
  jarvis-logs:
